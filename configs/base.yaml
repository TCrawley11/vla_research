# Rarely-changed defaults. Scenario files extend this via `extends` and win on
# conflicts. See `python -m carla_data_pipeline man config` for every field.
carla:
  host: localhost
  port: 2000
  tm_port: 8000
  timeout_sec: 10.0

capture:
  raw_fps: 30
  sample_fps: 5
  clip_sec: 3.0
  sample_period_sec: 1.0
  horizon_sec: 3.0
  waypoint_period_sec: 0.5

camera_spec: camera_spec/six_cam_1600x900.yaml

# Stage 3: after build-samples, ship the run to the team's private HF dataset
# repo, then drop the local .h5 (sidecar stays). Needs `hf auth login` once.
upload:
  enabled: true
  repo_id: VLA-uwo-2026/vla-carla-runs
  delete_local_h5: true
