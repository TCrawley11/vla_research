# Annotation benchmark: which VLM annotators to compare, on which samples, and
# how. Read by scripts/annotate_benchmark.py. Two model stages per sample:
#   1. questions.model writes the question set  -> out_dir/questions/<sample_id>.json
#   2. every entry of models answers it         -> out_dir/<sample_id>__<model>.json
# scripts/build_inspection.py renders the results side by side. Every field is
# validated (unknown keys are errors); see BenchmarkConfig in the script.

# Candidate annotators (OpenRouter model ids): stage 2, captions + answers.
# Adding one and re-running only annotates the missing (sample, model) pairs.
models:
  - qwen/qwen3.5-27b
  - qwen/qwen3.5-9b
  - qwen/qwen3.8-27b            # released 2026-08-14; one provider (AkashML) so far

samples:
  run: run43                    # run id in repo_id (null = random run); --h5 skips the download
  indices: [4, 5, 8, 10, 12, 13, 16, 18, 19, 21]   # fixed eval set (same frames as the 2026-08-10 smoke test)
  # instead of indices, random picks reproducible through the seed:
  # num_samples: 10
  # seed: 0

# Question author (stage 1): writes one question set per sample, which every
# candidate then answers. Kept out of the candidate list on purpose (the config
# rejects overlap) so no model answers questions it wrote itself.
questions:
  model: qwen/qwen3.5-397b-a17b # required; the biggest Qwen on OpenRouter, so question quality is not the bottleneck
  counts:                       # questions per QA class, per sample (18 total)
    perception: 6
    prediction: 4
    planning: 4
    behaviour: 4
  generation:                   # overrides of the generation block below, for the question author only
    max_tokens: 16000           # the 397B thinks 4-8k tokens before writing a set; 6000 truncated it repeatedly

# Format/style examples appended to the annotator prompt: k picked per sample,
# seeded by the sample id (identical prompt for every candidate on a sample,
# different examples across samples). Pool file is validated against the
# limits below and hashed into the result prompt_id. Uncomment to enable:
# examples:
#   path: configs/annotation/examples.yaml
#   k: 2

limits:                         # stated in the prompt and enforced code-side (violation -> retry with feedback)
  answer_max_words: 30
  caption_short_max_words: 25
  caption_detailed_min_words: 30
  caption_detailed_max_words: 70

generation:                     # identical for every candidate, so the comparison is fair
  temperature: 0.3
  max_tokens: 8000              # qwen3.5/3.8 think by default and thinking counts against this; with 18 questions qwen3.8 overflowed 6000 once
  max_attempts: 3               # schema-violation retries with feedback, per request
  reasoning: null               # OpenRouter `reasoning` object passed through, e.g. {enabled: false} or {effort: low}; null = provider default
  image_width: 800              # cameras are downscaled to this width before upload

repo_id: VLA-uwo-2026/six_cam_1600x900
out_dir: data/annotation_test
