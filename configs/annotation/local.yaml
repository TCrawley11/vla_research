# Local GGUF annotation: sequential walk of the team HF dataset, 6-camera
# key frames, Qwen3.5-9B Q6_K for both question writing and answers.
# Question writing uses thinking; answers do not.
# Serve first: scripts/serve_annotator.sh
# Then: python -m carla_data_pipeline annotate
# Smoke (spread indices, not spawn-adjacent 1-3):
#   python -m carla_data_pipeline annotate --config configs/annotation/smoke.yaml

repo_id: VLA-uwo-2026/six_cam_1600x900
out_dir: data/annotations

# Default: every runs/*.h5, samples 1..n-1 in order (index 0 is spawn).
# Set run / indices / limit only when you need a slice.
samples:
  run: null
  indices: null
  limit: null

inference:
  base_url: http://127.0.0.1:8001/v1
  model: qwen3.5-9b-q6_k          # must match --served-model-name
  concurrency: 2                  # 5060 Ti 16GB; raise after measuring KV
  timeout_sec: 300
  chat_template_kwargs:
    enable_thinking: false
  context_length: 8192             # must match serve_annotator.sh --max-model-len

questions:
  counts:
    perception: 6
    prediction: 3
    planning: 4
    behaviour: 1
  enable_thinking: true          # question writer only; annotator stays off
  max_tokens: 8000               # thinking counts against this; 4000 truncates

limits:
  answer_max_words: 30
  caption_short_max_words: 25
  caption_detailed_min_words: 30
  caption_detailed_max_words: 70

generation:
  temperature: 0.3
  max_tokens: 4000
  max_attempts: 3
  image_width: 800

examples:
  path: configs/annotation/examples.yaml
  k: 1
  questions: true
  answers: true
