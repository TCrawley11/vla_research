# The 6-camera rig (ported from the notebook's camera_specs).
# Mounting is in the vehicle frame, CARLA convention: x forward, y right, z up,
# meters/degrees. back_right uses a wider 110 fov, the rest use 70.
cameras:
  - name: FRONT
    fov: 70
    location: {z: 1.5}
  - name: FRONT_LEFT
    fov: 70
    location: {z: 1.5}
    rotation: {yaw: -55}
  - name: FRONT_RIGHT
    fov: 70
    location: {z: 1.5}
    rotation: {yaw: 55}
  - name: BACK
    fov: 70
    # Mounted at the rear of the roof (nuScenes-style), not the vehicle
    # centre: from x=0 the camera looks across the whole rear half of the car
    # and the ego body fills ~a third of the frame. x=-1.5 cuts the rear blind
    # zone to ~4.4 m while staying physically mountable (z=1.6 keeps the
    # nuScenes back-cam-slightly-higher convention).
    location: {x: -1.5, z: 1.6}
    rotation: {yaw: 180}
  - name: BACK_LEFT
    fov: 70
    location: {z: 1.5}
    rotation: {yaw: -120}
  - name: BACK_RIGHT
    fov: 110
    location: {z: 1.5}
    rotation: {yaw: 120}
