# Town10 (HD urban), light background traffic, 30-second scene.
# No seed: each run draws one and records it in the sidecar; pin `seed: N`
# here to reproduce a specific run.
extends: ../base.yaml

scenario:
  map_name: Town10HD_Opt

ego:
  blueprint: vehicle.tesla.model3

traffic:
  enabled: true
  num_vehicles: 20
  num_walkers: 10

capture:
  stop:
    duration_sec: 30
